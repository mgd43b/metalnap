# Artifact Hub repository metadata.
#
# For an OCI repository this file is NOT served from a URL and NOT packaged
# inside the chart -- Artifact Hub looks for it as a SEPARATE OCI artifact in
# the same repository, tagged `artifacthub.io`, with a specific layer media
# type. Pushed by .github/workflows/release.yml; see the `metadata` job there
# for the exact oras invocation.
#
# The repository ID is not a secret: it is shown in the Artifact Hub control
# panel and is published precisely so ownership can be verified.
repositoryID: 216105ba-adfd-4d17-9033-d654b10d01a1
owners:
  - name: mgd43b
    email: matt+claude@reloadingtracker.com
ignore:
  # Chart 0.1.0 shipped an artifacthub.io/signKey annotation with a placeholder
  # fingerprint and no url. `url` is mandatory once that entry exists, so
  # Artifact Hub cannot enrich the package and errors on EVERY processing pass:
  #
  #     invalid annotation: sign key url not provided (package: metalnap
  #     version: 0.1.0)
  #
  # Published chart versions are immutable, so 0.1.0 cannot be repaired -- and
  # it is already excluded from available_versions, so nobody can discover or
  # install it through Artifact Hub anyway. Ignoring it silences a permanent,
  # unfixable error without deleting a published artifact.
  #
  # `version` is a REGULAR EXPRESSION; omitting it would ignore every version.
  - name: metalnap
    version: ^0\.1\.0$
