{{- if include "metalnap.ceilingEnabled" . }}
# What the controller has concluded about its capacity ceiling, for
# `metalnap status` -- the one controller-wide fact that belongs to no node, and
# so lives in no annotation. The chart creates the object EMPTY and the
# controller fills it in. It is reporting, not control: nothing the controller
# decides is read from it, it is written after the tick's decisions are made, a
# failed write is logged and changes nothing, and it is not written in dry_run.
#
# No `data` here, deliberately: Helm's three-way merge then leaves whatever the
# controller wrote alone on an upgrade.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metalnap.statusName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "metalnap.labels" . | nindent 4 }}
{{- if .Values.rbac.create }}
---
# get and update on THIS object, by name, in this namespace: the same pattern as
# the warmup pods' delete in warmup-rbac.yaml, and the whole of what the
# controller is granted for the status. Not patch, not create, not any other
# ConfigMap. (`create` is the one verb resourceNames cannot constrain, which is
# why the chart creates the object and the controller never has to.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "metalnap.statusName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "metalnap.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
    resourceNames:
      - {{ include "metalnap.statusName" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "metalnap.statusName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "metalnap.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "metalnap.statusName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "metalnap.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
