{{- /*
  `on`, `off`, `yes` and `no` are YAML 1.1 BOOLEANS. An unquoted `mode: on` in
  a values file therefore arrives here as true, not "on" -- and the failure it
  produces without this check is "incompatible types for comparison: bool and
  string" from a template comparison, which points at the wrong thing entirely.
  Worse, if it rendered it would emit MODE: "true", an invalid mode that makes
  the controller refuse to start.
*/ -}}
{{- if not (kindIs "string" .Values.mode) }}
{{- fail (printf "mode must be a QUOTED string, one of off|dry_run|on -- got %v of type %s. Unquoted on/off/yes/no are YAML booleans, so quote it." .Values.mode (kindOf .Values.mode)) }}
{{- end }}
{{- if not (has .Values.mode (list "off" "dry_run" "on")) }}
{{- fail (printf "mode must be one of off|dry_run|on; got %q" .Values.mode) }}
{{- end }}
{{- /*
  A maintenance schedule that cannot fire is indistinguishable from the feature
  being switched off, so catch the two combinations that produce one at INSTALL
  time rather than in a controller log nobody is reading. The same checks live
  in metalnap/config.py, which is what actually enforces them -- these only
  move the discovery earlier.
*/ -}}
{{- with .Values.maintenance }}
{{- if gt (int .intervalS) 0 }}
{{- if le (int .intervalS) (int .windowS) }}
{{- fail (printf "maintenance.intervalS (%v) must exceed maintenance.windowS (%v), or a node is never asleep long enough to come due" .intervalS .windowS) }}
{{- end }}
{{- $floor := add (int .windowS) (int $.Values.timers.wakeTimeoutS) }}
{{- if lt (int .timeoutS) $floor }}
{{- fail (printf "maintenance.timeoutS (%v) must be at least maintenance.windowS + timers.wakeTimeoutS (%d), or the bound fires before a node that booted slowly has had its window" .timeoutS $floor) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
  Same reasoning, same duplication with metalnap/config.py: a cooldown shorter
  than the wake it is judged by lets the next power cycle land before the last
  one had a chance to work.
*/ -}}
{{- with .Values.timers }}
{{- if and (gt (int .powerCycleCooldownS) 0) (lt (int .powerCycleCooldownS) (int .wakeTimeoutS)) }}
{{- fail (printf "timers.powerCycleCooldownS (%v) must be 0 or at least timers.wakeTimeoutS (%v), or a node could be power-cycled again before the last cycle had a chance to work" .powerCycleCooldownS .wakeTimeoutS) }}
{{- end }}
{{- end }}
{{- /*
  The capacity ceiling's two sources are mutually exclusive, and its numbers
  cannot be negative -- the same checks as metalnap/config.py, here to move the
  discovery to install time. `static` is tested for null and never for
  truthiness: 0 is a ceiling of zero nodes.
*/ -}}
{{- with .Values.capacityCeiling }}
{{- if and .query (not (kindIs "invalid" .static)) }}
{{- fail "capacityCeiling.query and capacityCeiling.static are mutually exclusive: set one source of the ceiling, not both" }}
{{- end }}
{{- if and (not (kindIs "invalid" .static)) (lt (int .static) 0) }}
{{- fail (printf "capacityCeiling.static (%v) must be 0 or more: 0 sheds every node, and null means no ceiling" .static) }}
{{- end }}
{{- if lt (int .releaseHoldS) 0 }}
{{- fail (printf "capacityCeiling.releaseHoldS (%v) must be 0 or more" .releaseHoldS) }}
{{- end }}
{{- if lt (int .drainDeadlineS) 0 }}
{{- fail (printf "capacityCeiling.drainDeadlineS (%v) must be 0 or more; 0 never forces a busy node" .drainDeadlineS) }}
{{- end }}
{{- if and .query (or (le (int .timeoutS) 0) (gt (int .timeoutS) (int $.Values.timers.intervalS))) }}
{{- fail (printf "capacityCeiling.timeoutS (%v) must be above 0 and no more than timers.intervalS (%v): the read is made on the tick, and one that can outlast the interval stretches every tick" .timeoutS $.Values.timers.intervalS) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metalnap.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "metalnap.labels" . | nindent 4 }}
data:
  MODE: {{ .Values.mode | quote }}
  NODES: {{ join "," .Values.nodes | quote }}
  BMC_HOST_FMT: {{ .Values.bmc.hostFormat | quote }}
  PROM_URL: {{ .Values.prometheus.url | quote }}
  BURST_TAINT_KEY: {{ .Values.burstTaintKey | quote }}
  BURST_TAINT_VALUE: {{ .Values.burstTaintValue | quote }}
  BURST_TAINT_EFFECT: {{ .Values.burstTaintEffect | quote }}
  {{- with .Values.alertmanager.url }}
  ALERTMANAGER_URL: {{ . | quote }}
  {{- end }}
  ALERTMANAGER_SILENCE_LABELS: {{ join "," .Values.alertmanager.silenceLabels | quote }}
  {{- with .Values.alertmanager.silenceMatchers }}
  {{- /* One per line: a regex matcher may itself contain commas. */}}
  ALERTMANAGER_SILENCE_MATCHERS: {{ join "\n" . | quote }}
  {{- end }}
  {{- with .Values.warmup.image }}
  WARMUP_IMAGE: {{ . | quote }}
  {{- end }}
  {{- with .Values.warmup.pullSecrets }}
  WARMUP_PULL_SECRETS: {{ join "," . | quote }}
  {{- end }}
  WARMUP_TIMEOUT_S: {{ .Values.timers.warmupTimeoutS | quote }}
  ARC_NAMESPACE: {{ .Values.arc.namespace | quote }}
  CORDON_ANNOTATION: {{ .Values.cordonAnnotation | quote }}
  INTERVAL_S: {{ .Values.timers.intervalS | quote }}
  WAKE_SUSTAIN_S: {{ .Values.timers.wakeSustainS | quote }}
  SLEEP_SUSTAIN_S: {{ .Values.timers.sleepSustainS | quote }}
  MIN_UPTIME_S: {{ .Values.timers.minUptimeS | quote }}
  WAKE_TIMEOUT_S: {{ .Values.timers.wakeTimeoutS | quote }}
  DRAIN_TIMEOUT_S: {{ .Values.timers.drainTimeoutS | quote }}
  MAX_SLEEP_ATTEMPTS: {{ .Values.timers.maxSleepAttempts | quote }}
  SLEEP_COOLDOWN_S: {{ .Values.timers.sleepCooldownS | quote }}
  {{- /* No `| default`: 0 is meaningful (escalation off), and default eats 0. */}}
  POWER_CYCLE_COOLDOWN_S: {{ .Values.timers.powerCycleCooldownS | quote }}
  SHUTDOWN_TIMEOUT_S: {{ .Values.timers.shutdownTimeoutS | quote }}
  DEFAULT_CAPACITY: {{ .Values.timers.defaultCapacityGib | quote }}
  {{- with .Values.maintenance }}
  {{- /*
    No `| default` on any of these. Sprig's default fires on any EMPTY value
    and 0 is empty, so `staggerS: 0` -- a deliberate "give me no spread" --
    would silently come back as an hour. values.yaml supplies all four, and
    Helm merges maps, so overriding one key leaves the others in place.
  */}}
  MAINTENANCE_INTERVAL_S: {{ .intervalS | quote }}
  MAINTENANCE_WINDOW_S: {{ .windowS | quote }}
  MAINTENANCE_STAGGER_S: {{ .staggerS | quote }}
  MAINTENANCE_TIMEOUT_S: {{ .timeoutS | quote }}
  {{- end }}
  {{- with .Values.capacityCeiling }}
  {{- /*
    No `| default` and no bare `if .static`: 0 is a ceiling, and both read it as
    unset. The two timers are always rendered, as the other timers are -- a
    deadline of 0 is meaningful (never force) and is warned about at start.
  */}}
  {{- if .query }}
  CEILING_QUERY: {{ .query | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" .static) }}
  CEILING_STATIC: {{ int64 .static | quote }}
  {{- end }}
  CEILING_RELEASE_HOLD_S: {{ int64 .releaseHoldS | quote }}
  CEILING_DRAIN_DEADLINE_S: {{ int64 .drainDeadlineS | quote }}
  CEILING_TIMEOUT_S: {{ int64 .timeoutS | quote }}
  {{- end }}
  {{- if include "metalnap.ceilingEnabled" . }}
  {{- /* Where the controller publishes what `metalnap status` shows. */}}
  STATUS_CONFIGMAP: {{ include "metalnap.statusName" . | quote }}
  {{- end }}
  {{- if gt (int .Values.metrics.port) 0 }}
  METRICS_PORT: {{ int .Values.metrics.port | quote }}
  {{- end }}
  {{- with .Values.queries.shortfall }}
  SHORTFALL_QUERY: {{ . | quote }}
  {{- end }}
  {{- if .Values.queries.cpuShortfall }}
  CPU_SHORTFALL_QUERY: {{ if eq .Values.queries.cpuShortfall "-" }}""{{ else }}{{ .Values.queries.cpuShortfall | quote }}{{ end }}
  {{- end }}
  {{- if .Values.queries.saturation }}
  SATURATION_QUERY: {{ if eq .Values.queries.saturation "-" }}""{{ else }}{{ .Values.queries.saturation | quote }}{{ end }}
  {{- end }}
