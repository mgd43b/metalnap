apiVersion: v2
name: metalnap
description: Suspend idle bare-metal Kubernetes nodes to save power, without killing running work
type: application
version: 0.2.4
appVersion: "0.2.4"
home: https://github.com/mgd43b/metalnap
sources:
  - https://github.com/mgd43b/metalnap
keywords:
  - bare-metal
  - power-management
  - autoscaling
  - ipmi
  - energy-efficiency
  - self-hosted-runners
maintainers:
  - name: mgd43b
    url: https://github.com/mgd43b
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  artifacthub.io/prerelease: "true"
  # NO artifacthub.io/signKey here. It is optional, and `url` is MANDATORY once
  # the entry exists -- a placeholder fingerprint with no url fails indexing
  # with "sign key url not provided", which is exactly what v0.1.0 did. Add it
  # only alongside real `helm package --sign` provenance and a published key.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/mgd43b/metalnap
    - name: safety rules
      url: https://github.com/mgd43b/metalnap#the-rules-it-will-not-break
