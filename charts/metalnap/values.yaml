image:
  repository: ghcr.io/mgd43b/metalnap
  # Pin a version. `latest` is published for convenience but a controller that
  # power-cycles hardware should never float.
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Nodes metalnap is allowed to manage. It will touch nothing else.
nodes: []
  # - k8s14
  # - k8s15

# off | dry_run | on
#
# Ships as dry_run ON PURPOSE. In this mode it observes and logs every decision
# it WOULD take and touches nothing. Watch it for as long as it takes to trust
# the numbers before promoting to `on`.
mode: dry_run

bmc:
  # Format string for a node's BMC hostname. {node} is substituted.
  #
  # MUST BE ABSOLUTE -- note the trailing dot. The image is Alpine, and musl's
  # resolver does not fall back from the search list to the absolute name the
  # way glibc does. Without the trailing dot a dotted BMC hostname does not
  # resolve at all, and metalnap cannot power nodes on or even read their power
  # state -- while every test still passes and the pod starts cleanly. Setting
  # `ndots` does not fix this: metalnap also resolves SHORT names
  # (prometheus-k8s.monitoring.svc), which need the search list, so no single
  # ndots value serves both. A trailing dot is correct under any ndots.
  #
  # A single-label name (no dots) is fine as-is; the search list resolves it.
  hostFormat: "{node}-ipmi.internal.example.org."
  # Existing Secret with keys `user` and `pass`. Created out of band -- BMC
  # credentials do not belong in values.yaml or in git.
  existingSecret: metalnap-bmc

prometheus:
  url: http://prometheus-k8s.monitoring.svc:9090

# STRONGLY recommended. A node powering off looks exactly like a node dying, so
# without this every sleep pages someone -- and people paged for routine events
# stop reading the alerts that matter. Leave the URL empty to disable, and
# accept that consequence knowingly.
#
# Only nodes metalnap itself put down are silenced. One that crashed, one an
# operator holds, and one metalnap has stopped being able to account for all
# stay loud -- and for the last, metalnap raises MetalnapNodeNeedsAttention
# (severity=critical, labels node and instance) so it can be routed to a page.
alertmanager:
  url: http://alertmanager-main.monitoring.svc:9093
  # One silence per label, matching <label>=<node>. A node's alerts do not
  # agree on a label: kube-state-metrics alerts (KubeNodeUnreachable and
  # friends) name it in `node`, relabelled node-exporter alerts in `instance`.
  # Silencing `instance` alone let every sleep through as KubeNodeUnreachable.
  silenceLabels: [instance, node]
  # Extra matchers ANDed into every silence, in amtool syntax. Set these to
  # mute only what a sleep is EXPECTED to trip, so anything else a sleeping
  # node raises still arrives. Every silence also carries
  # alertname!="MetalnapNodeNeedsAttention", so metalnap's own alert is never
  # muted -- a negative matcher, which needs Alertmanager 0.22 or later.
  # For example:
  #   - 'alertname=~"KubeNodeUnreachable|KubeletInstanceUnreachable"'
  silenceMatchers: []

# Pull this image onto a node after waking it, so the first jobs do not each
# pay for it. Empty disables the warmup entirely.
warmup:
  image: ""
  pullSecrets: []

# The taint that keeps other work off your sleepable nodes, exactly as they
# carry it -- `kubectl taint node <node> ci-burst=true:NoSchedule`. The warmup
# pod tolerates it, and only pending work tolerating it, by the scheduler's own
# rule, counts as demand: work that does not can never land here, however much
# room the node has. So a taint that differs from the nodes' reads as NO demand.
burstTaintKey: ci-burst
burstTaintValue: "true"
burstTaintEffect: NoSchedule

arc:
  namespace: arc-runners

# The annotation that marks a cordon as metalnap's own. A cordon WITHOUT it is
# an operator's, and metalnap will never override it. Changing this on a
# running install orphans any cordon it currently holds.
cordonAnnotation: metalnap.io/cordoned

# Bring idle nodes up on a schedule so they collect package updates, config
# management runs and firmware they would otherwise never see. A node that
# sleeps for weeks has to catch all of that up the moment demand finally wants
# it, which is the worst possible time for a forty-minute upgrade run.
#
# OFF by default: it powers hardware on when nothing asked for it, and that
# should be a decision somebody made. Set intervalS to enable -- 86400 is a
# sensible start.
#
# The node stays CORDONED for the whole visit, on purpose. Uncordoning would
# advertise capacity about to be taken away again, so every visit would end by
# draining real work under a five-minute deadline. Host-level updates and
# anything running as a DaemonSet proceed regardless of a cordon; if you need
# the node schedulable, you want a longer ordinary wake, not this.
maintenance:
  intervalS: 0            # 0 disables. 86400 = once a day per node.
  windowS: 300            # how long it stays up, measured from Ready
  staggerS: 3600          # per-node spread, so a rack does not power on in unison
  timeoutS: 3600          # bound on one visit; must exceed windowS + wakeTimeoutS

# Every timer, in seconds. Defaults match metalnap/config.py.
timers:
  intervalS: 60
  wakeSustainS: 120       # demand must persist this long before waking
  sleepSustainS: 1200     # ...and stay low this long before sleeping
  minUptimeS: 2700        # a freshly-woken node may not sleep yet
  wakeTimeoutS: 900
  drainTimeoutS: 1800
  warmupTimeoutS: 900
  maxSleepAttempts: 5
  sleepCooldownS: 1800
  defaultCapacityGib: 125.7
  # A node still powered but not Ready at its wake timeout is wedged -- a
  # locked kernel reads "on" to its BMC indefinitely. It is power-cycled at
  # most once per node per this long, bounded by an annotation on the node
  # (metalnap.io/power-cycled; delete it to re-arm) so a restart cannot re-arm
  # it by accident. Never while an operator's cordon is on it, never while the
  # cluster lists work running on it. Needing a second cycle inside the window
  # means it needs a human: it is then unmuted and alerted on instead. 0
  # disables the cycle and alerts straight away. Must be 0 or at least
  # wakeTimeoutS.
  powerCycleCooldownS: 86400
  # How long a soft shutdown may take before the node is reported as one that
  # would not power off. Never forced.
  shutdownTimeoutS: 600

# Override the demand queries if your signal differs. The pool is sized on
# whichever of memory and CPU needs more nodes: runners that run out of CPU
# first were sized on memory alone, and woke about half the nodes they needed.
# By default both are read off the unschedulable pods themselves, with the
# scheduler's effective-request formula -- native sidecars (a runner's dind)
# included, ordinary init containers counted only as the floor they are.
queries:
  shortfall: ""           # memory, GiB, as PromQL; empty = read off the pods
  cpuShortfall: ""        # CPU, cores, as PromQL; empty = read off the pods; "-" sizes on memory alone
  saturation: ""          # empty = the ARC default; "-" disables the term

rbac:
  create: true

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
affinity: {}

# DELIBERATELY EMPTY, and think hard before filling it.
#
# metalnap must not run on a node it manages. Tolerating the taint that keeps
# work off your sleepable nodes lets the scheduler place the controller on one
# of them -- and it will then cordon and power off the machine it is running
# on, losing the process mid-drain.
tolerations: []

podAnnotations: {}
