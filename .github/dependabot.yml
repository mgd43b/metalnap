# Dependabot for metalnap.
#
# Grouped and weekly on purpose. This is a single-maintainer project, and a
# stream of one-PR-per-bump is how update PRs stop being read at all -- which
# is worse than not having them, because the security ones arrive in the same
# stream and get skimmed with the rest.
version: 2
updates:
  # The workflows publish an image that runs with cluster credentials and BMC
  # passwords, so a compromised action here reaches further than the code does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # `chore(deps):` -- a valid Conventional Commit type, and HIDDEN from the
      # changelog by release-please-config.json. Deliberate: bumping an action
      # changes how the artifact is built, not the artifact itself, so it does
      # not warrant a release of metalnap.
      prefix: "chore"
      include-scope: true

  # debian:12-slim, plus the ipmitool and python3-requests it carries. The base
  # image is where CVEs actually accumulate for this project -- the Python
  # surface is one dependency.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      # `fix(deps):` -- release-please treats this as a PATCH and lists it under
      # Fixes. Correct here, unlike the action bumps: debian:12-slim and the
      # ipmitool it carries ARE the published image, so a bump changes what
      # users run and deserves a release they can see.
      prefix: "fix"
      include-scope: true

  # requests is the only runtime dependency. Ungrouped: with one package a
  # group adds nothing, and an individual PR is easier to read.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      # Same reasoning: requests ships inside the image.
      prefix: "fix"
      include-scope: true
