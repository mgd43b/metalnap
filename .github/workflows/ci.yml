name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile
        run: python3 -m compileall -q metalnap tests

      - name: Unit tests
        run: python3 -B tests/test_controller.py

      - name: Simulation harness
        # Thousands of ticks against a fake cluster with randomised demand and
        # injected faults, asserting safety AND liveness after every tick.
        # Every bug this project's ancestor shipped lived in a SEQUENCE, which
        # single-call unit tests cannot see. ~1s for 30k ticks.
        run: python3 -B tests/sim.py --seeds 60 --ticks 500

      - name: Simulation harness (long soak)
        # A wider sweep on one interpreter: some invariants are probabilistic
        # backstops and want more seeds to be reliable.
        if: matrix.python == '3.11'
        run: python3 -B tests/sim.py --seeds 200 --ticks 800
