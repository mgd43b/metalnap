# Publishes the container image and Helm chart to ghcr.io.
#
# TRIGGERED BY THE TAG that release-please creates when its release PR is
# merged. release-please owns versioning, the changelog, the tag and the
# GitHub Release; this workflow owns the artifacts. Creating the Release here
# too would collide with it, so that job was removed.
#
# GITHUB_TOKEN's packages:write is enough -- no PAT, no repo secrets to
# configure. PyPI publishing is deliberately NOT here: it needs a trusted
# publisher configured on the PyPI side first, and a workflow that fails on
# every tag until someone does that is worse than no workflow.
name: release

on:
  # Called by release-please.yml when a release is actually created.
  #
  # It cannot be triggered by the tag: release-please tags using GITHUB_TOKEN,
  # and GitHub does not trigger workflows from GITHUB_TOKEN events (a loop
  # guard). Relying on `push: tags` produced release v0.2.9 with no image and
  # no chart -- a release that existed only on the releases page.
  #
  # The alternative fix is a PAT for release-please, which trades a workflow
  # wiring problem for a long-lived credential with write access. Not worth it.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.9"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Version consistency
        run: ./scripts/check-versions.sh

      - name: Gate on the test suites
        # A tag must not publish an image the suites have not passed. Cheap
        # enough (~10s) that there is no excuse to skip it.
        run: |
          python -m venv .venv
          .venv/bin/python -B tests/test_controller.py
          .venv/bin/python -B tests/sim.py --seeds 60 --ticks 900

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU so the arm64 layer builds on an amd64 runner.
      #
      # The honest rationale, since the first version of this comment gave a
      # bad one: this controller runs IN the cluster it manages, so it will
      # never run on a laptop. Apple Silicon is not the reason. The reason is
      # ARM servers with BMCs -- Ampere Altra and similar -- which are real but
      # uncommon, and evaluators running `--help` before deploying.
      #
      # Cost is +93s (41s -> 134s) on RELEASE ONLY, not on push. Cheap enough
      # to keep for a case that might arrive; drop `platforms` if it ever is
      # not.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    # Separate job so a chart problem cannot half-publish an image, and so the
    # chart is only pushed once the image it references actually exists.
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5

      - name: Lint and render
        # `helm template` alone proves the chart parses; rendering and checking
        # the objects proves it produces the thing it claims to.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 charts/validate.py charts/metalnap/Chart.yaml
          helm lint charts/metalnap --set 'nodes={a,b}'
          helm template t charts/metalnap --set 'nodes={a,b}' > /tmp/r.yaml
          grep -q 'kind: ClusterRole' /tmp/r.yaml
          grep -q 'runAsNonRoot: true' /tmp/r.yaml
          # The controller must never tolerate the taint on nodes it manages.
          if grep -q 'tolerations:' /tmp/r.yaml; then
            echo "chart renders tolerations by default -- metalnap could be"                  "scheduled onto a node it powers off" >&2
            exit 1
          fi

      - name: Package and push
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm package charts/metalnap -d /tmp/pkg
          helm push /tmp/pkg/metalnap-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Push the Artifact Hub metadata
        # For an OCI repository this file is NOT served over HTTP and NOT
        # packaged inside the chart -- both of which are the natural guess, and
        # both are wrong. Artifact Hub looks for a SEPARATE OCI artifact in the
        # same repository, tagged `artifacthub.io`, and reads the layer with
        # the media type below. Without it the repository stays unverified and
        # nothing says why.
        run: |
          curl -sSL -o /tmp/oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          tar xzf /tmp/oras.tgz -C /tmp oras
          echo "${{ secrets.GITHUB_TOKEN }}" | /tmp/oras login ghcr.io -u ${{ github.actor }} --password-stdin
          /tmp/oras push ghcr.io/${{ github.repository_owner }}/charts/metalnap:artifacthub.io --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
