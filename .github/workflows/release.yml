# Publishes a container image to ghcr.io. Runs on a version tag, and on manual
# dispatch for a one-off build.
#
# GITHUB_TOKEN's packages:write is enough -- no PAT, no repo secrets to
# configure. PyPI publishing is deliberately NOT here: it needs a trusted
# publisher configured on the PyPI side first, and a workflow that fails on
# every tag until someone does that is worse than no workflow.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Gate on the test suites
        # A tag must not publish an image the suites have not passed. Cheap
        # enough (~10s) that there is no excuse to skip it.
        run: |
          python -m venv .venv
          .venv/bin/python -B tests/test_controller.py
          .venv/bin/python -B tests/sim.py --seeds 60 --ticks 900

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU so the arm64 layer builds on an amd64 runner.
      #
      # The honest rationale, since the first version of this comment gave a
      # bad one: this controller runs IN the cluster it manages, so it will
      # never run on a laptop. Apple Silicon is not the reason. The reason is
      # ARM servers with BMCs -- Ampere Altra and similar -- which are real but
      # uncommon, and evaluators running `--help` before deploying.
      #
      # Cost is +93s (41s -> 134s) on RELEASE ONLY, not on push. Cheap enough
      # to keep for a case that might arrive; drop `platforms` if it ever is
      # not.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    # Separate job so a chart problem cannot half-publish an image, and so the
    # chart is only pushed once the image it references actually exists.
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint and render
        # `helm template` alone proves the chart parses; rendering and checking
        # the objects proves it produces the thing it claims to.
        run: |
          helm lint charts/metalnap --set 'nodes={a,b}'
          helm template t charts/metalnap --set 'nodes={a,b}' > /tmp/r.yaml
          grep -q 'kind: ClusterRole' /tmp/r.yaml
          grep -q 'runAsNonRoot: true' /tmp/r.yaml
          # The controller must never tolerate the taint on nodes it manages.
          if grep -q 'tolerations:' /tmp/r.yaml; then
            echo "chart renders tolerations by default -- metalnap could be"                  "scheduled onto a node it powers off" >&2
            exit 1
          fi

      - name: Package and push
        run: |
          helm registry login ghcr.io             -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm package charts/metalnap -d /tmp/pkg
          helm push /tmp/pkg/metalnap-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
