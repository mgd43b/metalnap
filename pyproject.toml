[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metalnap"
version = "0.5.0" # x-release-please-version
description = "Power bare-metal Kubernetes nodes down when the queue is empty, without killing running work"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["requests>=2.25"]

[project.scripts]
# The operator's CLI, and only that. The controller is `python -m metalnap`,
# which is what the image runs.
metalnap = "metalnap.cli:console"

[project.urls]
Homepage = "https://github.com/mgd43b/metalnap"

[tool.setuptools.packages.find]
include = ["metalnap*"]

[tool.ruff.lint]
# Pinned, not left to ruff's defaults: those grew between releases to take in
# pyupgrade, isort and ruff's own rules, and CI installs whichever ruff is
# newest -- so a tree clean on one machine failed 165 checks on the next.
# Pyflakes, and the pycodestyle rules nobody argues about.
select = ["E4", "E7", "E9", "F"]
